version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartbook-postgres
    environment:
      POSTGRES_DB: smartbook_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartbook-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartbook_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: MiClaveSecretaMuyLargaParaQueSeaSeguraYNoTeRompaLaAplicacion
    ports:
      - "8080:8080"

volumes:
  postgres-data:
